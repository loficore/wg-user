name: Release

# Tag push -> full build (Go cross-compile for 4 arches + WebUI) -> GitHub
# Release with wg-user-<version>.zip and SHA256SUMS attached.
#
# workflow_dispatch runs the same build and uploads the zip as a workflow
# artifact, but does not create a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  # build.sh defaults to the China mirror; on GitHub use the canonical proxy.
  GOPROXY: https://proxy.golang.org,direct

jobs:
  build:
    name: Build + package
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches module.prop
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(sed -n 's/^version=//p' module.prop)
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match module.prop version v$v"
            exit 1
          fi

      - uses: actions/setup-go@v7
        with:
          # Pinned to the 1.26 series (.tool-versions says 1.26.5), never
          # `stable`, so a new Go major cannot land in a release unreviewed.
          go-version: '1.26.x'

      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'scripts/build.sh') }}
          restore-keys: go-${{ runner.os }}-

      - name: go vet + go test
        run: make test

      # The "every arch produced a binary" assertion lives in make build
      # (test/shell/build_test.sh) and is repeated hard by package-only's
      # check-bins guard, so there is no separate loop here.
      - name: Cross-compile wg-user for 4 arches
        run: make build

      # ---------------- WebUI + package ----------------
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: webui/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml

      - name: Build WebUI and zip the module
        run: make package-only

      - name: Checksums
        run: |
          cd dist
          sha256sum wg-user-*.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Show zip contents
        run: |
          zipinfo -1 dist/wg-user-*.zip | sed -n '1,40p'
          echo "total entries: $(zipinfo -1 dist/wg-user-*.zip | wc -l)"

      - uses: actions/upload-artifact@v7
        with:
          name: wg-user-module
          path: |
            dist/wg-user-*.zip
            dist/SHA256SUMS
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "wg-user ${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/wg-user-*.zip dist/SHA256SUMS
